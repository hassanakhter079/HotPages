plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hassan.pageshub'
    compileSdk 34

    defaultConfig {
        applicationId 'com.hassan.pageshub'
        minSdk 24
        targetSdk 34
        versionCode 8
        versionName '1.0.7'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
